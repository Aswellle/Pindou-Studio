<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <!-- 不预连接 Supabase 直连域名:生产环境 REST/Storage 全走同源 /sb 代理,
       预连接只会让移动端多一次用不上的 TLS 握手;本地开发直连时浏览器自会连接。 -->
  <meta charset="UTF-8" />
  <!-- JS 一启动就显示骨架(见文件末尾的 #boot-skeleton);无 JS 时不加类,骨架保持隐藏。 -->
  <script>document.documentElement.classList.add("js-booting")</script>
  <!-- 部署后旧 HTML 可能仍引用已被删除的 /assets/<hash>:
       浏览器缓存/恢复的旧标签页会拿到 404 的入口 JS 或惰性 chunk,表现为白屏。
       这里捕获资源错误,自动带 _r 重新加载一次换到最新 HTML。
       只自动重载一次(URL 已带 _r 或本标签页已重载过就停),避免慢网/无痕模式下
       反复刷新导致「一直在加载」;15 秒仍停在骨架则显示手动重试按钮。 -->
  <script>
    (function () {
      var DONE_KEY = 'bead_studio_asset_reload_done'
      function forceReload() {
        try {
          var u = new URL(location.href)
          u.searchParams.set('_r', String(Date.now()))
          location.replace(u.toString())
        } catch (e) {
          location.reload()
        }
      }
      function reloadOnce() {
        try {
          if (new URL(location.href).searchParams.has('_r')) return
        } catch (e) { /* 忽略 */ }
        try {
          if (sessionStorage.getItem(DONE_KEY)) return
          sessionStorage.setItem(DONE_KEY, '1')
        } catch (e) {
          // 无痕模式/禁用存储:用内存标记 + URL 上的 _r 双重防循环
          if (window.__beadAssetReloaded) return
          window.__beadAssetReloaded = true
        }
        forceReload()
      }
      window.__beadRetry = forceReload
      window.addEventListener('error', function (e) {
        var t = e.target
        if (!t) return
        var url = t.src || t.href || ''
        if ((t.tagName === 'SCRIPT' || t.tagName === 'LINK') && url.indexOf('/assets/') !== -1) reloadOnce()
      }, true)
      window.addEventListener('unhandledrejection', function (e) {
        var m = String((e.reason && (e.reason.message || e.reason)) || '')
        if (/dynamically imported module|Importing a module script failed|module script failed|ChunkLoadError/i.test(m)) reloadOnce()
      })
      // 慢网/入口脚本静默失败:只展示手动重试按钮,不再自动刷新 —— 自动刷新会在
      // 弱网下反复重启加载,表现就是「点击结果页一直加载中」。
      // 注意不要等 DOMContentLoaded:延迟的 module 脚本会拖住它,定时器要立即开始。
      setTimeout(function () {
        try {
          var btn = document.getElementById('boot-retry')
          if (btn && document.getElementById('boot-skeleton') && !document.querySelector('.app')) {
            btn.hidden = false
          }
        } catch (e) { /* 忽略 */ }
      }, 15000)
    })()
  </script>
  <!-- 主题防白闪:首帧绘制前同步解析 bead_studio_settings.themeMode(缺省/非法 = system,
       未登录用户没有偏好入口,恒为 system),把 data-theme 与 color-scheme 写到 <html> 上。
       判定规则与 src/utils/theme.js 严格一致(两处无共享代码,改动必须同步);
       暗色令牌全部挂在 index.css 的 [data-theme='dark'] 选择器下。
       theme-color(移动端地址栏色)见下方「浏览器 / PWA」段,运行时由 theme.js 按主题改写。 -->
  <script>
    (function () {
      try {
        var s = JSON.parse(localStorage.getItem('bead_studio_settings') || '{}')
        var m = s.themeMode === 'light' || s.themeMode === 'dark' ? s.themeMode : 'system'
        var dark = m === 'dark' || (m === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
        var t = dark ? 'dark' : 'light'
        document.documentElement.setAttribute('data-theme', t)
        document.documentElement.style.colorScheme = t
      } catch (e) { /* 隐私模式等读不到:保持浅色默认 */ }
    })()
  </script>
  <!-- interactive-widget=resizes-content:让【支持该参数的浏览器】(Chromium 系)在键盘
       弹出时收缩布局视口,浮层自动落在键盘上方。Safari / iOS Safari 至今不支持它
       (见 caniuse 该条目与 w3c/editing#549),所以 iOS 完全走 JS/CSS 路径:
       useKeyboardSafe 监听 visualViewport 写 --visible-vh / --visible-vh-top /
       --keyboard-height,根壳与全屏浮层据此定位。两种浏览器都能得到正确结果,
       且支持该参数的浏览器会因为布局视口已收缩而自然得到 0 键盘内边距,不会双重补偿。 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />

    #boot-skeleton .bs-spinner {
      width: 15px; height: 15px; border: 2px solid currentColor; border-right-color: transparent;
      border-radius: 50%; animation: bs-spin .8s linear infinite; opacity: .45;
    }
    #boot-skeleton .bs-canvas {
      width: min(76vw, 520px); aspect-ratio: 1 / 1; border-radius: 16px;
      border: 1px solid rgba(127,127,127,.18); background-color: rgba(255,255,255,.5);
      background-image:
        linear-gradient(to right, rgba(127,127,127,.10) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(127,127,127,.10) 1px, transparent 1px);
      background-size: 22px 22px;
    }
    html[data-theme='dark'].js-booting #boot-skeleton .bs-canvas { background-color: rgba(255,255,255,.04) }
    #boot-skeleton #boot-retry {
      margin-top: 2px; padding: 8px 16px; border-radius: 999px; cursor: pointer;
      border: 1px solid rgba(127,127,127,.35); background: rgba(255,255,255,.55);
      color: inherit; font: inherit; font-size: 13px; line-height: 1.2;
    }
    #boot-skeleton #boot-retry:hover { background: rgba(255,255,255,.8) }
    html[data-theme='dark'].js-booting #boot-skeleton #boot-retry { background: rgba(255,255,255,.06) }
    #boot-skeleton .bs-bottom { display: none; height: 64px; flex: none; border-top: 1px solid rgba(127,127,127,.18) }
    @keyframes bs-spin { to { transform: rotate(360deg) } }
    @media (min-width: 1025px) { #boot-skeleton .bs-side { display: block } }
    @media (max-width: 1024px) { #boot-skeleton .bs-bottom { display: block } }
    @media (prefers-reduced-motion: reduce) { #boot-skeleton .bs-spinner { animation: none } }
  </style>
</head>
<body>
  <div id="boot-skeleton" aria-hidden="true">
    <div class="bs-top"></div>
    <div class="bs-main">
      <div class="bs-side"></div>
      <div class="bs-stage">
        <div class="bs-logo">
          <svg class="bs-mark" viewBox="0 0 32 32" aria-hidden="true">
            <rect width="8" height="8" x="0" y="0" fill="#e53935" />
            <rect width="8" height="8" x="8" y="0" fill="#fdd835" />
            <rect width="8" height="8" x="16" y="0" fill="#32cd32" />
            <rect width="8" height="8" x="24" y="0" fill="#1976d2" />
            <rect width="8" height="8" x="0" y="8" fill="#f06292" />
            <rect width="8" height="8" x="8" y="8" fill="#ba68c8" />
            <rect width="8" height="8" x="16" y="8" fill="#00bcd4" />
            <rect width="8" height="8" x="24" y="8" fill="#ff9800" />
            <rect width="8" height="8" x="0" y="16" fill="#ffffff" />
            <rect width="8" height="8" x="8" y="16" fill="#e0e0e0" />
            <rect width="8" height="8" x="16" y="16" fill="#000000" />
            <rect width="8" height="8" x="24" y="16" fill="#795548" />
            <rect width="8" height="8" x="0" y="24" fill="#8d6e63" />
            <rect width="8" height="8" x="8" y="24" fill="#a1887f" />
            <rect width="8" height="8" x="16" y="24" fill="#bdbdbd" />
            <rect width="8" height="8" x="24" y="24" fill="#6d4c41" />
          </svg>
          <span>拼豆 Studio</span>
          <span class="bs-spinner"></span>
        </div>
        <div class="bs-canvas"></div>
        <button id="boot-retry" type="button" hidden onclick="window.__beadRetry && window.__beadRetry()">加载较慢，点击重试</button>
      </div>
      <div class="bs-side bs-right"></div>
    </div>
    <div class="bs-bottom"></div>
  </div>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
