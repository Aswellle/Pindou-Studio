name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:run

      - name: Check i18n key parity
        run: npm run check-i18n

      - name: Build
        run: npm run build

      - name: Verify generated fonts CSS in sync
        run: git diff --exit-code -- src/styles/fonts-all.css || (echo "::error::src/styles/fonts-all.css 与生成器输出不一致,请重新运行 node scripts/generate-fonts-css.js 并提交"; exit 1)
